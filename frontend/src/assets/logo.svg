<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- 主背景圆形 -->
  <circle cx="20" cy="20" r="19" fill="url(#grad1)" opacity="0.95"/>
  
  <!-- 装饰性光晕 -->
  <circle cx="20" cy="20" r="16" fill="url(#grad2)" opacity="0.4"/>
  
  <!-- 书本图标 -->
  <g transform="translate(10, 11)">
    <!-- 左侧书页 -->
    <path d="M2 2 L2 16 L8 14 L8 0 Z" fill="white" opacity="0.9"/>
    <!-- 右侧书页 -->
    <path d="M12 0 L12 14 L18 16 L18 2 Z" fill="white" opacity="0.9"/>
    <!-- 书脊 -->
    <rect x="8" y="0" width="4" height="14" fill="white" opacity="0.95"/>
    <!-- 书本装饰线 -->
    <line x1="8" y1="4" x2="12" y2="4" stroke="#667eea" stroke-width="0.8" opacity="0.6"/>
    <line x1="8" y1="7" x2="12" y2="7" stroke="#667eea" stroke-width="0.8" opacity="0.6"/>
    <line x1="8" y1="10" x2="12" y2="10" stroke="#667eea" stroke-width="0.8" opacity="0.6"/>
  </g>
  
  <!-- AI 神经网络节点 -->
  <g opacity="0.85">
    <!-- 节点 -->
    <circle cx="13" cy="28" r="1.5" fill="white"/>
    <circle cx="20" cy="30" r="1.5" fill="white"/>
    <circle cx="27" cy="28" r="1.5" fill="white"/>
    <circle cx="16.5" cy="32" r="1.2" fill="white" opacity="0.7"/>
    <circle cx="23.5" cy="32" r="1.2" fill="white" opacity="0.7"/>
    
    <!-- 连接线 -->
    <line x1="13" y1="28" x2="20" y2="30" stroke="white" stroke-width="0.8" opacity="0.5"/>
    <line x1="20" y1="30" x2="27" y2="28" stroke="white" stroke-width="0.8" opacity="0.5"/>
    <line x1="13" y1="28" x2="16.5" y2="32" stroke="white" stroke-width="0.6" opacity="0.4"/>
    <line x1="20" y1="30" x2="16.5" y2="32" stroke="white" stroke-width="0.6" opacity="0.4"/>
    <line x1="20" y1="30" x2="23.5" y2="32" stroke="white" stroke-width="0.6" opacity="0.4"/>
    <line x1="27" y1="28" x2="23.5" y2="32" stroke="white" stroke-width="0.6" opacity="0.4"/>
  </g>
  
  <!-- 闪光效果 -->
  <circle cx="28" cy="12" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="30" cy="14" r="0.8" fill="white" opacity="0.6"/>
</svg>
