services: # 定义一系列的服务（容器）
  scholarmind_api: # 自定义的服务名称，这里是主应用程序API服务
    build: # 定义构建镜像的配置
      context: . # 构建上下文改为当前目录 (backend/)
      dockerfile: ./app/Dockerfile # Dockerfile的路径也相应调整
    hostname: scholarmind_api # 设置容器的主机名，在容器内部可见
    container_name: scholarmind_api # 设置容器的名称，在Docker守护进程中可见
    environment: # 设置容器内的环境变量
      HF_ENDPOINT: https://hf-mirror.com
      DATABASE_URL: postgresql://postgres:pg123456@scholarmind_db:5432/scholarmind
      ES_HOST: http://scholarmind_vector:9200
      ROOT_PATH: http://localhost:8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      RAG_PROJECT_BASE: /app/service/core
      SM_MINERU_MODE: http
      SM_MINERU_ENDPOINT: http://mineru:8001
      SM_GROBID_ENDPOINT: http://grobid:8070
      SM_RERANKER_ENDPOINT: http://reranker:8002  # 精排服务端点
      PYTHONUNBUFFERED: 1
    extra_hosts: # 添加额外的主机名到IP地址的映射，类似于/etc/hosts文件
      - "host.docker.internal:host-gateway" # 允许容器连接到宿主机的特殊地址
    env_file: # 从文件加载环境变量
      - .env # 指定加载.env文件，用于存放敏感信息或本地配置
    ports: # 定义端口映射，格式为 "宿主机端口:容器端口"
      - "8000:8000"  # 将宿主机的8000端口映射到容器的8000端口
    volumes: # 定义数据卷挂载，用于数据持久化或代码同步
      - ./app:/app # 挂载本地的 app 目录，实现代码热更新
      - D:/Anaconda/envs/llm-dev/nltk_data:/usr/local/nltk_data # 挂载本地NLTK数据目录到容器中
      - ./storage_root:/app/service/core/storage
      - models_data:/models  # 共享模型目录（与reranker服务共享）
    command: ["uvicorn", "app_main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"] # 容器启动时执行的命令，并开启热重载
    restart: unless-stopped # 定义容器的重启策略，除非手动停止，否则容器会自动重启
    depends_on: # 定义服务间的依赖关系，确保依赖的服务先启动
      - scholarmind_db # 依赖PostgreSQL数据库服务
      - scholarmind_vector # 依赖Elasticsearch服务
      - redis # 依赖Redis服务
      - mineru # 依赖MinerU解析服务
      - grobid # 依赖Grobid元数据服务
      - reranker # 依赖精排服务
    networks: # 指定服务连接的网络
      - scholarmind_net # 连接到名为scholarmind_net的自定义网络

  scholarmind_vector: # Elasticsearch服务
    container_name: scholarmind-es-01 # 容器名称
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3 # 使用的Elasticsearch镜像
    volumes: # 数据卷挂载
      - sm_esdata01:/usr/share/elasticsearch/data # 将ES数据持久化到名为sm_esdata01的数据卷
    env_file: .env # 从.env文件加载环境变量
    environment: # 环境变量设置
      - node.name=es01 # ES节点名称
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD} # ES密码，从.env文件读取
      - bootstrap.memory_lock=false # 是否锁定内存，开发环境通常设为false
      - discovery.type=single-node # 设置为单节点模式
      - xpack.security.enabled=true # 启用X-Pack安全特性
      - xpack.security.http.ssl.enabled=false # 禁用HTTP SSL
      - xpack.security.transport.ssl.enabled=false # 禁用传输层SSL
      - cluster.routing.allocation.disk.watermark.low=5gb # 磁盘使用低水位线
      - cluster.routing.allocation.disk.watermark.high=3gb # 磁盘使用高水位线
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb # 磁盘使用洪水阶段水位线
      - TZ=${TIMEZONE} # 时区设置，从.env文件读取
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # 设置ES的JVM堆大小
    mem_limit: ${MEM_LIMIT} # 内存使用限制，从.env文件读取
    ulimits: # 设置容器的资源限制
      memlock: # 内存锁定限制
        soft: -1 # 软限制
        hard: -1 # 硬限制
    healthcheck: # 健康检查配置
      test: ["CMD-SHELL", "curl http://localhost:9200"] # 检查ES是否可访问
      interval: 10s # 检查间隔
      timeout: 10s # 超时时间
      retries: 120 # 重试次数
    restart: on-failure # 重启策略，只在失败时重启
    networks: # 连接的网络
      - scholarmind_net

  scholarmind_db: # PostgreSQL数据库服务
    container_name: scholarmind_db # 容器名称
    image: postgres:15-alpine # 使用官方的 PostgreSQL 15 镜像的轻量级版本 (alpine)
    ports:
      - "15432:5432"
    environment: # 环境变量
      - POSTGRES_PASSWORD=pg123456 # 数据库密码
      - POSTGRES_USER=postgres # 数据库用户名
      - POSTGRES_DB=scholarmind # 数据库名称
    volumes: # 数据卷挂载
      - pg_data:/var/lib/postgresql/data # 将数据库数据持久化到名为pg_data的数据卷
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql # 在初始化时执行init.sql脚本
    restart: unless-stopped # 重启策略
    networks: # 连接的网络
      - scholarmind_net

  redis: # Redis缓存服务
    container_name: scholarmind_redis # 容器名称
    image: redis:7-alpine # 使用的Redis镜像
    volumes: # 数据卷挂载
      - redis_data:/data # 将Redis数据持久化到名为redis_data的数据卷
    restart: unless-stopped # 重启策略
    networks: # 连接的网络
      - scholarmind_net

  mineru: # MinerU PDF 解析服务（GPU 加速）
    container_name: scholarmind_mineru
    build:
      context: ./services/mineru
      dockerfile: Dockerfile.gpu  # 使用 GPU 版本的 Dockerfile
    hostname: mineru
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all  # 让容器看到所有 GPU
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}  # 默认使用第一块 GPU
    ports:
      - "8001:8001"  # 暴露端口供调试（可选）
    volumes:
      - ./services/mineru:/app  # 代码热更新（开发环境）
    # GPU 支持：使用 NVIDIA Container Toolkit
    # 前提：宿主机已安装 NVIDIA 驱动 + NVIDIA Container Toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1  # 使用1个GPU，或设置为all使用所有GPU
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - scholarmind_net

  grobid: # Grobid 学术元数据抽取服务
    container_name: scholarmind_grobid
    image: lfoppiano/grobid:0.8.0
    hostname: grobid
    environment:
      - GROBID_OPTS=-Xmx4g
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8070' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s # Grobid 启动非常慢，给3分钟启动时间
    restart: unless-stopped
    networks:
      - scholarmind_net

  reranker: # BGE Reranker 精排服务（GPU 加速）
    container_name: scholarmind_reranker
    build:
      context: ./services/reranker
      dockerfile: Dockerfile.gpu  # 使用 GPU 版本的 Dockerfile
    hostname: reranker
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all  # 让容器看到所有 GPU
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}  # 默认使用第一块 GPU
      - RERANKER_MODEL_PATH=/models/bge-reranker-large
      - RERANKER_USE_QUANTIZATION=true  # 启用 INT8 量化（8GB 显存推荐）
    ports:
      - "8002:8002"  # 暴露端口供调试（可选）
    volumes:
      - models_data:/models  # 使用命名volume共享模型目录
    # GPU 支持：使用 NVIDIA Container Toolkit
    # 前提：宿主机已安装 NVIDIA 驱动 + NVIDIA Container Toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1  # 使用1个GPU，或设置为all使用所有GPU
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - scholarmind_net

  latex_agent: # LaTeX 编辑 Agent 服务
    container_name: scholarmind_latex_agent
    build:
      context: ./services/latex_agent
      dockerfile: Dockerfile
    hostname: latex_agent
    env_file:
      - .env  # 加载 .env 文件，包含 LLM_API_KEY 等配置
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - PORT=8003
      - RAG_SERVICE_URL=http://scholarmind_api:8000
      - DATABASE_URL=postgresql://postgres:pg123456@scholarmind_db:5432/scholarmind
    ports:
      - "8003:8003"  # 暴露端口供调试
    volumes:
      - latex_workspaces:/app/workspaces  # 工作区文件存储
      - ./services/latex_agent:/app  # 代码热更新（开发环境）
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8003", "--reload"]  # 开启热重载
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - scholarmind_api  # 依赖主应用服务
      - scholarmind_db   # 依赖数据库服务
    networks:
      - scholarmind_net

  deep_research: # DeepResearch 服务
    container_name: scholarmind_deep_research
    build:
      context: ./services/deep_research
      dockerfile: Dockerfile
    hostname: deep_research
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - PORT=8004
      - RAG_SERVICE_URL=http://scholarmind_api:8000
      - DATA_ROOT=/app/data/deep_research
    ports:
      - "8004:8004"  # 暴露端口供调试
    volumes:
      - deep_research_data:/app/data/deep_research
      - ./services/deep_research:/app  # 代码热更新（开发环境）
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8004", "--reload"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - scholarmind_api
    networks:
      - scholarmind_net

  # 可选：DeepSeek-OCR 服务占位（默认不启用）
  deepseek_ocr:
    image: nginx:alpine
    container_name: scholarmind_deepseek_ocr
    profiles: ["extras"]
    ports:
      - "9001:9000"  # 模拟端口
    command: ["sh", "-c", "printf 'HTTP/1.1 200 OK\\r\\nContent-Type: application/json\\r\\n\\r\\n{\"latex\":\"E=mc^2\"}\\r\\n' | nc -l -p 9000 -k"]
    networks:
      - scholarmind_net

  # 可选：Qwen2-VL 服务占位（默认不启用）
  qwen2_vl:
    image: nginx:alpine
    container_name: scholarmind_qwen2_vl
    profiles: ["extras"]
    ports:
      - "8002:8002"
    command: ["sh", "-c", "printf 'HTTP/1.1 200 OK\\r\\nContent-Type: application/json\\r\\n\\r\\n{\"summary\":\"bar chart shows ...\"}\\r\\n' | nc -l -p 8002 -k"]
    networks:
      - scholarmind_net

volumes: # 定义全局的数据卷
  sm_esdata01: # Elasticsearch数据卷
    driver: local # 使用本地驱动
  pg_data: # PostgreSQL数据卷
    driver: local # 使用本地驱动
  redis_data: # Redis数据卷
    driver: local # 使用本地驱动
  models_data: # 模型数据卷（共享给API和reranker服务）
    driver: local # 使用本地驱动
  latex_workspaces: # LaTeX 工作区数据卷
    driver: local # 使用本地驱动
  deep_research_data: # DeepResearch 数据卷
    driver: local

networks: # 定义全局的网络
  scholarmind_net: # 自定义网络名称
    driver: bridge # 使用桥接模式驱动
