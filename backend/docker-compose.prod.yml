services:
  scholarmind_api:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: scholarmind_api
    hostname: scholarmind_api
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-pg123456}@scholarmind_db:5432/${POSTGRES_DB:-scholarmind}}
      REDIS_HOST: ${REDIS_HOST:-scholarmind_redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      SM_VECTOR_STORE: ${SM_VECTOR_STORE:-pgvector}
      SM_PARSER_ORDER: ${SM_PARSER_ORDER:-llamaparse,unstructured_api,pymupdf}
      SM_GROBID_ENABLED: ${SM_GROBID_ENABLED:-false}
      SM_RERANKER_TYPE: ${SM_RERANKER_TYPE:-dashscope}
      PYTHONUNBUFFERED: "1"
    command:
      [
        "uvicorn",
        "app_main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
        "--timeout-graceful-shutdown",
        "10",
      ]
    volumes:
      - ${SM_STORAGE_ROOT:-/opt/data/scholarmind/storage}:/app/service/core/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      scholarmind_db:
        condition: service_started
      scholarmind_redis:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - scholarmind_net

  cloudflared:
    image: cloudflare/cloudflared:2026.2.0
    container_name: cf_tunnel_scholarmind
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "--protocol",
        "http2",
        "--loglevel",
        "info",
        "--metrics",
        "0.0.0.0:2000",
        "run",
        "--token",
        "${CF_TUNNEL_TOKEN:-}",
      ]
    depends_on:
      scholarmind_api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - scholarmind_net

  scholarmind_db:
    image: pgvector/pgvector:pg15
    container_name: scholarmind_db
    hostname: scholarmind_db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pg123456}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-scholarmind}
    command:
      [
        "postgres",
        "-c",
        "shared_buffers=128MB",
        "-c",
        "work_mem=4MB",
        "-c",
        "maintenance_work_mem=64MB",
        "-c",
        "effective_cache_size=512MB",
        "-c",
        "max_connections=80",
      ]
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scholarmind}"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - scholarmind_net

  scholarmind_redis:
    image: redis:7-alpine
    container_name: scholarmind_redis
    hostname: scholarmind_redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "192mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - scholarmind_net

  doc_studio:
    build:
      context: .
      dockerfile: ./services/doc_studio/Dockerfile
    container_name: scholarmind_doc_studio
    hostname: doc_studio
    env_file:
      - .env.production
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app:/shared
      PORT: 8003
      RAG_SERVICE_URL: http://scholarmind_api:8000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-pg123456}@scholarmind_db:5432/${POSTGRES_DB:-scholarmind}}
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8003",
        "--workers",
        "1",
        "--timeout-graceful-shutdown",
        "10",
      ]
    volumes:
      - latex_workspaces:/app/workspaces
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8003/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      scholarmind_api:
        condition: service_healthy
      scholarmind_db:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - scholarmind_net

  deep_research:
    build:
      context: .
      dockerfile: ./services/deep_research/Dockerfile
    container_name: scholarmind_deep_research
    hostname: deep_research
    env_file:
      - .env.production
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app:/shared
      PORT: 8004
      RAG_SERVICE_URL: http://scholarmind_api:8000
      DATA_ROOT: /app/data/deep_research
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8004",
        "--workers",
        "1",
        "--timeout-graceful-shutdown",
        "10",
      ]
    volumes:
      - deep_research_data:/app/data/deep_research
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8004/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      scholarmind_api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - scholarmind_net

volumes:
  pg_data:
    name: scholarmind_prod_pg_data
  redis_data:
    name: scholarmind_prod_redis_data
  latex_workspaces:
    name: scholarmind_prod_latex_workspaces
  deep_research_data:
    name: scholarmind_prod_deep_research_data

networks:
  scholarmind_net:
    driver: bridge
